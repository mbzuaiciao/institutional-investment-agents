[project]
name = "institutional-investment-agents"
version = "0.1.0"
description = "A reproducible research workbench for evaluating agent architectures in institutional credit research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9,<4",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_investment_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tutorials", "prototype", "experiments", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
